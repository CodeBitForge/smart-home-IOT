name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - name: Use example config
        run: cp firmware/include/config.example.h firmware/include/config.h
      - name: Build firmware
        working-directory: firmware
        run: pio run
